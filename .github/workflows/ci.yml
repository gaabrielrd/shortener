name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancela execuções antigas da mesma branch quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# O build valida a configuração obrigatória sem depender de um projeto real.
# IDs demo- nunca alcançam serviços Firebase que não estejam emulados.
env:
  VITE_FIREBASE_API_KEY: ci-public-test-key
  VITE_FIREBASE_AUTH_DOMAIN: demo-shortener.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: demo-shortener
  VITE_FIREBASE_STORAGE_BUCKET: demo-shortener.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  VITE_FIREBASE_APP_ID: 1:000000000000:web:ci
  VITE_FIREBASE_USE_EMULATORS: 'true'
  VITE_PUBLIC_SHORT_BASE_URL: http://127.0.0.1:5000

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Mesma linha do runtime de Functions e da versão fixada em .nvmrc.
        node: ['22.22.2']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Validar
        run: npm run validate

      - name: Publicar relatório de cobertura
        if: always() && matrix.node == '22.22.2'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      # Roda apenas no CI: uma falha aqui indica vulnerabilidade publicada,
      # não um erro de código. Manter fora do `validate` evita travar o
      # trabalho local por indisponibilidade do registry.
      - name: Auditar vulnerabilidades
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Verificar toolchain
        run: |
          npm --version
          npm run check:toolchain

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar no navegador
        run: npm run test:e2e

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  firebase:
    name: Firebase Emulators
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fixar npm declarado
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Instalar dependências
        run: npm ci

      - name: Validar toda a pilha Firebase demo
        run: npm run test:firebase
